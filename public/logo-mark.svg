<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SplitTab logo">
  <title>SplitTab</title>
  <!-- Brand squircle -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#1CC29F"/>
  <!-- Receipt (the "tab"), right half tinted to suggest the split -->
  <defs>
    <clipPath id="tab">
      <path d="M21 15 H43 V45 L40.25 49 L37.5 45 L34.75 49 L32 45 L29.25 49 L26.5 45 L23.75 49 L21 45 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tab)">
    <rect x="21" y="15" width="22" height="34" fill="#FFFFFF"/>
    <rect x="32" y="15" width="11" height="34" fill="#DDF3ED"/>
  </g>
  <!-- Receipt detail lines -->
  <g stroke="#1CC29F" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
    <line x1="24.5" y1="24" x2="29.3" y2="24"/>
    <line x1="24.5" y1="30.5" x2="29.3" y2="30.5"/>
    <line x1="34.7" y1="24" x2="39.5" y2="24"/>
    <line x1="34.7" y1="30.5" x2="39.5" y2="30.5"/>
  </g>
  <!-- Perforation: the split -->
  <line x1="32" y1="19" x2="32" y2="41" stroke="#1CC29F" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.4"/>
</svg>
