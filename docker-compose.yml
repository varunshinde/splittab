services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise_dev_only
      POSTGRES_DB: splitwise
    # Bind to localhost only: the app reaches Postgres over the compose
    # network, so the database never needs a public port. Publishing on all
    # interfaces would expose a database whose password is in this repo.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://splitwise:splitwise_dev_only@db:5432/splitwise
    ports: ["3000:3000"]
    depends_on: [db]
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npx prisma db seed; npm run start"
volumes:
  pgdata:
